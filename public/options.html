<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- Title is set from locales at runtime; no hardcoded copy here. -->
    <title></title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <h2 id="key-heading"></h2>
      <div id="key-host"></div>
      <div class="button-row">
        <button id="test-key" type="button"></button>
        <button id="clear-key" type="button"></button>
      </div>
      <label class="checkbox-row" id="image-only-row">
        <input type="checkbox" id="image-only">
        <span id="image-only-label"></span>
      </label>
      <h2 id="cost-heading"></h2>
      <p id="cost-line"></p>
      <div class="button-row">
        <button id="reset-cost" type="button"></button>
      </div>
      <h2 id="privacy-heading"></h2>
      <p id="privacy-body"></p>
      <div id="status-region" role="status" class="visually-hidden"></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
