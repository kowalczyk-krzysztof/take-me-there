name: ci

on:
  push:
  pull_request:

# NOTE: actions are pinned to major tags; resolve these to commit SHAs for a
# fully hermetic supply chain.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: node scripts/verify-bundle.mjs
      - run: npm audit
